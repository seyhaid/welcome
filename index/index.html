<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Luxury Hotel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">Beaumier</div>
    <div class="nav-right">
      <span>EN</span>
      <button class="book-btn">BOOK</button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">

    <!-- Video Background -->
    <video autoplay muted loop playsinline class="bg-video">
      <source src="video.mp4" type="video/mp4">
    </video>

    <!-- Overlay Content -->
    <div class="overlay">
      <h2 class="welcome-text">WELCOME</h2>
      <h1>WELLNESS</h1>
      <button class="discover-btn">DISCOVER OUR HOTELS</button>
    </div>

  </section>

  <!-- Menu -->
  <nav class="menu">
    <a href="#">OUR HOTELS</a>
    <a href="#">CHARACTER</a>
    <a href="#">FOOD & DRINK</a>
    <a href="#">WELLNESS</a>
    <a href="#">EVENTS & CELEBRATIONS</a>
    <a href="#">GIFT CARDS</a>
    <a href="#">NEWS</a>
  </nav>
<!-- Image Section -->
<section class="image-section">

  <div class="image-box">
    <img src="photo_2026-02-05_02-19-10.jpg" alt="Hotel 1">
    <div class="caption">
      <h3>Relax & Wellness</h3>
      <p>Experience peace and comfort in nature</p>
    </div>
  </div>

  <div class="image-box">
    <img src="photo_2026-02-05_02-40-02.jpg" alt="Hotel 2">
    <div class="caption">
      <h3>Luxury Rooms</h3>
      <p>Enjoy modern design with full comfort</p>
    </div>
  </div>

</section>
</body>
</html>
